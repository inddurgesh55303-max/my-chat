<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>
    <style>
        body { font-family: Arial; background: #f4f1ea; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-box { width: 350px; height: 500px; background: white; border-radius: 10px; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #0b4f34; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: #e2f0d9; padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-all; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: white; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { background: #0b4f34; color: white; border: none; padding: 10px 15px; margin-left: 5px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-box">
        <div class="header">🔒 Live Chat Room</div>
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Message likhein...">
            <button onclick="send()">Bhejein</button>
        </div>
    </div>

    <!-- Socket.io library -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function send() {
            let text = document.getElementById("msgInput").value.trim();
            if (text !== "") {
                socket.emit('chat message', text);
                document.getElementById("msgInput").value = "";
            }
        }

        socket.on('chat message', function(msg) {
            let box = document.getElementById("messages");
            let div = document.createElement("div");
            div.classList.add("msg");
            div.innerText = msg;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        document.getElementById("msgInput").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
